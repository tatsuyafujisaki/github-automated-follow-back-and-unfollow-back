on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
      - run: npm install --no-package-lock
      - run: npx tsc
      - run: node src/main.ts
